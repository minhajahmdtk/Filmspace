<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="{% static 'website.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light px-4" style="background-color:#DEB887; height: 80px; padding-top: 10px; padding-bottom: 10px;">
    <div class="container-fluid">

      <a class="navbar-brand d-flex align-items-center fw-bold text-danger" href="#">
        <img src="{% static 'images/filmspace_logo.png' %}" alt="FilmSpace Logo" width="40" height="40" class="me-2 rounded">
        FilmSpace
      </a>

      
      <div class="position-absolute start-50 translate-middle-x">
        <a class="nav-link fw-semibold" href="{% url 'index' %}">Home</a>
      </div>

      
      <div class="btn-group dropstart ms-auto">
          <button type="button" class="btn  btn-outline-light dropdown-toggle"        data-bs-toggle="dropdown" aria-expanded="false">Sign In
          </button>
        <ul class="dropdown-menu custom-dropdown">
          <li><a class="dropdown-item "  href="{% url 'login' %}">Sign In</a></li>
          <li><a class="dropdown-item" href="{% url 'register' %}">Register</a></li>
        </ul>
      </div>
    </nav>
  <div class="container mt-5">
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
