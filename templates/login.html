<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace | Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body style="background-color: #FFFAF0; min-height: 100vh; overflow-x: hidden;">

  
  <div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1000;">
    <a class="fw-semibold text-decoration-none px-3 py-2 rounded"
       href="{% url 'index' %}"
       style="color:#000; background-color: rgba(255,255,255,0.8); backdrop-filter: blur(4px);">
      Home
    </a>
  </div>
  <div class="d-flex justify-content-center align-items-center py-5" style="min-height: 100vh;">
    <div class="row shadow-lg overflow-hidden w-100 mx-3"
         style="max-width: 950px; border-radius: 25px; background-color: white;">

     
      <div class="col-md-6 p-0 d-flex align-items-center justify-content-center">
        <img src="{% static 'signin.jpg' %}"
             alt="Sign In Illustration"
             class="img-fluid w-100 h-100"
             style="object-fit: cover; opacity: 0.9; border-top-left-radius: 25px; border-bottom-left-radius: 25px;">
      </div>

      
      <div class="col-md-6 bg-white p-5 d-flex flex-column justify-content-center">
        <div class="text-center mb-3">
          <h3 class="fw-bold text-dark mb-1"><i class="bi bi-arrow-right-circle"></i> Sign In</h3>
          <p class="text-muted">Access your <span style="font-family: 'Playfair Display', serif;" >FilmSpace</span> account</p>
        </div>

        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold small">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold small">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
          </div>

          <div class="d-grid mt-3">
            <button type="submit" class="btn fw-semibold text-white btn-dark">Sign In</button>
          </div>

          {% if messages %}
          <div class="mt-3">
            {% for msg in messages %}
              <div class="alert alert-info text-center py-2">{{ msg }}</div>
            {% endfor %}
          </div>
          {% endif %}
        </form>
      </div>
    </div>
  </div>

</body>
</html>
