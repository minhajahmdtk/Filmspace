{% extends 'base.html' %}
{% load static %}
{% block title %}Sign In | FilmSpace{% endblock %}

{% block content %}
<div class="signin-container d-flex justify-content-center align-items-center min-vh-100">
  <div class="signin-form w-100" style="max-width: 400px;">
    <h3 class="text-center mb-4 text-primary fw-bold">🎬 Sign In to FilmSpace</h3>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-primary">Sign In</button>
      </div>
    </form>

    {% if messages %}
      <div class="mt-3">
        {% for msg in messages %}
          <div class="alert alert-info text-center py-2">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
