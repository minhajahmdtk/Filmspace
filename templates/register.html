{% extends 'base.html' %}
{% load static %}
{% block title %}Register | FilmSpace{% endblock %}

{% block content %}
<div class="register-container d-flex justify-content-center align-items-center min-vh-100">
  <div class="register-form w-100" style="max-width: 450px;">
    <h3 class="text-center mb-4 text-primary fw-bold">🎬 Create Your FilmSpace Account</h3>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Username</label>
        <input type="text" id="username" name="user_name" class="form-control" placeholder="Enter username" required>
      </div>

      <div class="mb-3">
        <label for="firstname" class="form-label fw-semibold">First Name</label>
        <input type="text" id="firstname" name="first_name" class="form-control" placeholder="Enter first name" required>
      </div>

      <div class="mb-3">
        <label for="lastname" class="form-label fw-semibold">Last Name</label>
        <input type="text" id="lastname" name="last_name" class="form-control" placeholder="Enter last name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Enter email" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" id="pass_word" name="pass_word" class="form-control" placeholder="Enter password" required>
      </div>

      <div class="mb-3">
        <label for="password2" class="form-label fw-semibold">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" class="form-control" placeholder="Confirm password" required>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-primary">Register</button>
      </div>
    </form>

    {% if messages %}
      <div class="mt-3">
        {% for msg in messages %}
          <div class="alert alert-info text-center py-2">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
