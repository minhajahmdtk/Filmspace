<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body style="background-color: #FFFAF0; min-height: 100vh; overflow-x: hidden;">

  <!-- Fixed Home Link -->
  <div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1000;">
    <a class="fw-semibold text-decoration-none px-3 py-2 rounded"
       href="{% url 'index' %}"
       style="color:#000; background-color: rgba(255,255,255,0.8); backdrop-filter: blur(4px);">
      Home
    </a>
  </div>

  <!-- Main Container -->
  <div class="d-flex justify-content-center align-items-start" style="min-height: 100vh;">
    <div class="row shadow-lg overflow-hidden w-100 mx-3 "
         style="max-width: 1150px; border-radius: 20px; background-color: white; margin-top: 55px;">

      <!-- Left Image Section -->
      <div class="col-md-6 p-0 d-flex align-items-center justify-content-center" >
        <img src="{% static 'register1.jpg' %}"
             alt="Register Illustration"
             class="img-fluid w-100 h-100"
             style="object-fit: cover; opacity: 0.9; border-top-left-radius: 20px; border-bottom-left-radius: 20px;">
      </div>

      <!-- Right Registration Section -->
      <div class="col-md-6 bg-white p-4 d-flex flex-column justify-content-center">
        <div class="text-center mb-2">
          <h4 class="fw-bold text-dark mb-1"><i class="bi bi-arrow-right-circle"></i>  Register</h4>
          <p class="text-muted small mb-3">Create your <span style="font-family: 'Playfair Display', serif;">FilmSpace</span> account</p>
        </div>

        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}

          <div class="mb-2">
            <label for="first_name" class="form-label fw-semibold small">First Name</label>
            <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Enter first name" required>
          </div>

          <div class="mb-2">
            <label for="last_name" class="form-label fw-semibold small">Last Name</label>
            <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Enter last name" required>
          </div>

          <div class="mb-2">
            <label for="email" class="form-label fw-semibold small">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter email" required>
          </div>

          <div class="mb-2">
            <label for="user_name" class="form-label fw-semibold small">Username</label>
            <input type="text" id="user_name" name="user_name" class="form-control" placeholder="Enter username" required>
          </div>

          <div class="mb-2">
            <label for="pass_word" class="form-label fw-semibold small">Password</label>
            <input type="password" id="pass_word" name="pass_word" class="form-control" placeholder="Enter password" required>
          </div>

          <div class="mb-3">
            <label for="confirm" class="form-label fw-semibold small">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" class="form-control" placeholder="Confirm password" required>
          </div>

          <div class="d-grid mt-2">
            <button type="submit" class="btn fw-semibold text-white btn-dark">Register</button>
          </div>

          {% if messages %}
          <div class="mt-3">
            {% for msg in messages %}
              <div class="alert alert-info text-center py-2">{{ msg }}</div>
            {% endfor %}
          </div>
          {% endif %}
        </form>

        <div class="text-center mt-2">
          <small>Already registered?
            <a href="{% url 'login' %}" class="text-decoration-none fw-semibold" style="color: #c00000;">Sign In</a>
          </small>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
