{% extends 'admin_base.html' %}
{% load static %}
{% block title %}Add Series | FilmSpace{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center">
  <div class="shadow p-4 rounded bg-white w-100" style="max-width: 700px;">
    <h3 class="text-center mb-4 fw-bold text-dark bg-dark text-white py-2 rounded"> <i class="bi bi-arrow-return-right"></i> Add Series</h3>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label for="series_name" class="form-label fw-semibold">Series Name</label>
          <input type="text" id="series_name" name="series_name" class="form-control" placeholder="Enter series name" required>
        </div>

        <div class="col-md-6">
          <label for="series_year" class="form-label fw-semibold">Year</label>
          <input type="text" id="series_year" name="series_year" class="form-control" placeholder="Enter release year" required>
        </div>

        <div class="col-md-6">
          <label for="series_language" class="form-label fw-semibold">Language</label>
          <input type="text" id="series_language" name="series_language" class="form-control" placeholder="Enter language">
        </div>

        <div class="col-md-6">
          <label for="series_genre" class="form-label fw-semibold">Genre</label>
          <input type="text" id="series_genre" name="series_genre" class="form-control" placeholder="Enter genre">
        </div>

        <div class="col-md-6">
          <label for="series_seasons" class="form-label fw-semibold">Seasons</label>
          <input type="text" id="series_seasons" name="series_seasons" class="form-control" placeholder="Enter number of seasons" required>
        </div>

        <div class="col-md-6">
          <label for="series_director" class="form-label fw-semibold">Director</label>
          <input type="text" id="series_director" name="series_director" class="form-control" placeholder="Enter director name" required>
        </div>

        <div class="col-md-6">
          <label for="series_image" class="form-label fw-semibold">Upload Image</label>
          <input type="file" id="series_image" name="series_image" class="form-control" required>
        </div>

        <div class="col-12">
          <label for="series_description" class="form-label fw-semibold">Description</label>
          <textarea id="series_description" name="series_description" rows="3" class="form-control" placeholder="Enter series description"></textarea>
        </div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-dark fw-semibold">Add Series</button>
      </div>
    </form>

    {% if messages %}
      <div class="mt-3">
        {% for msg in messages %}
          <div class="alert alert-info text-center py-2">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
