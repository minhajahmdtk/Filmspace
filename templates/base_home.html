<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'website.css' %}">
</head>

<body style="background-color: #ffffff; min-height: 100vh; overflow-x: hidden;">

  <!-- ✅ Transparent Responsive Navbar -->
  <div class="container-fluid position-fixed top-0 start-0 py-3 px-4 d-flex flex-wrap justify-content-between align-items-center"
       style="z-index: 1000; background: rgba(255,255,255,0.6); backdrop-filter: blur(5px);">

    <!-- Left: Logo -->
    <div class="d-flex align-items-center mb-2 mb-md-0">
      <img src="{% static 'filmspace.png' %}" 
           alt="FilmSpace Logo" width="200px" height="45" class="me-2 rounded">
      
    </div>

    <!-- Center: Home -->
    <div class="text-center mb-2 mb-md-0 position-absolute start-50 translate-middle-x">
      <a class="fw-semibold text-decoration-none px-3 py-2 rounded"
         href="{% url 'home' %}"
         style="color:#000;">
        Home
      </a>
    </div>

    <!-- Right: Buttons -->
    <div class="d-none d-md-flex gap-2 justify-content-end">
      <a href="{% url 'logout' %}" 
         class="btn btn-outline-dark fw-semibold px-4 py-2">
        Sign Out
      </a>
    </div>

    <!-- Mobile Dropdown -->
    <div class="dropdown d-md-none">
      <button class="btn btn-outline-dark dropdown-toggle fw-semibold" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Menu
      </button>
      <ul class="dropdown-menu dropdown-menu-end text-center">
        <li><a class="dropdown-item fw-semibold" href="{% url 'logout' %}">Sign Out</a></li>
      </ul>
    </div>
  </div>

  <!-- ✅ Page Content -->
  <div class="container" style="padding-top: 120px;">
    {% block content %}
    {% endblock %}
  </div>

</body>
</html>
