<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'website.css' %}">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">

      <!-- Left: Brand -->
      <a class="navbar-brand fw-bold fs-4" href="#">🎬 FilmSpace</a>

      <!-- Toggler for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Center + Right Links -->
      <div class="collapse navbar-collapse justify-content-between" id="navbarContent">
        <ul class="navbar-nav mx-auto text-center">
          <li class="nav-item">
            <a class="nav-link text-white fw-semibold" href="{% url 'home' %}">Home</a>
          </li>
        </ul>

        <!-- Right: Sign Out Button -->
        <div class="d-flex justify-content-center mt-2 mt-lg-0">
          <a class="btn btn-outline-light px-3" href="{% url 'logout' %}">Sign Out</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="container-fluid p-0">
    {% block content %}
    {% endblock %}
  </main>

</body>
</html>
