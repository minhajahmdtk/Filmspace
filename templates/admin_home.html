{% extends 'admin_base.html' %}
{% block title %}Home | FilmSpace{% endblock %}
{% load static %}

{% block content %}
<style>
  .dashboard-title {
    font-size: 2rem;
    font-weight: bold;
    text-align: center;
    margin-bottom: 40px;
  }

  .stat-card {
    background-image: url("{% static 'images/admin_bg.jpg' %}");
    background-size: cover;
    background-position: center;
    border-radius: 15px;
    color: white;
    text-align: center;
    padding: 50px 20px;
    margin: 20px auto;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease-in-out;
    max-width: 400px;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 15px;
  }

  .stat-card h1, .stat-card p, .stat-card .btn-group {
    position: relative;
    z-index: 1;
  }

  .stat-card h1 {
    font-size: 3.5rem;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .stat-card p {
    font-size: 1.3rem;
    letter-spacing: 1px;
  }

  .stat-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  }

  .btn-group {
    margin-top: 20px;
  }

  .btn-custom {
    border-radius: 25px;
    padding: 8px 20px;
    font-weight: 500;
    margin: 0 5px;
    transition: all 0.3s ease;
  }

  .btn-custom:hover {
    transform: scale(1.05);
  }
</style>

<div class="container mt-5">
  <h2 class="dashboard-title">🎬 FilmSpace Admin Dashboard</h2>

  <div class="row justify-content-center">
    <!-- Movies Card -->
    <div class="col-md-4">
      <div class="stat-card">
        <h1>{{ total_movies }}</h1>
        <p>Total Movies</p>
        <div class="btn-group">
          <a href="{% url 'add_movie' %}" class="btn btn-success btn-custom">Add</a>
          <a href="{% url 'update_movie' %}" class="btn btn-warning btn-custom">Update</a>
          <a href="" class="btn btn-danger btn-custom">Delete</a>
        </div>
      </div>
    </div>

    <!-- Series Card -->
    <div class="col-md-4">
      <div class="stat-card">
        <h1>{{ total_series }}</h1>
        <p>Total Series</p>
        <div class="btn-group">
          <a href="{% url 'add_series' %}" class="btn btn-success btn-custom">Add</a>
          <a href="{% url 'update_series' %}" class="btn btn-warning btn-custom">Update</a>
          <a href="" class="btn btn-danger btn-custom">Delete</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
