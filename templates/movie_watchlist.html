<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="{% static 'website.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="">FilmSpace</a>
      <div class="mx-auto">
        <a class="nav-link text-white" href="{% url 'movies' %}">Movies</a>
      </div>
      <div>
        <a class="btn btn-outline-light" href="{% url 'logout' %}">Sign Out</a>
      </div>
    </div>
  </nav>


<div class="container my-5">
  <h1 class="text-center mb-2">Movies</h1>
  <div class="row">
    {% for i in mov_watch %}
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm h-100">
        <img src="{{ i.movie_image.url }}" class="card-img-top" alt="{{ i.movie_image }}">
        
        <div class="card-body">
          <div class="movie-title">{{ i.movie_name }} ({{ i.movie_year }})</div>
          <div class="movie-genre">{{ i.movie_genre }}</div>
        </div>
      </div>
    </div>
    {% endfor %}
   

  </div>




  {% if mov_watch.paginator.num_pages > 1 %}
  <div class="text-center">
    {% for i in mov_watch.paginator.page_range %}
    <a href="?page={{ i }}" class="btn btn-light mx-1">{{ i }}</a>
    {% endfor %}
  </div>
  {% endif %}
</div>
  

</body>
</html>
