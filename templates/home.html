{% extends 'base_home.html' %}
{% block title %}Home | FilmSpace{% endblock %}
{% load static %}
{% block content %}

<div class="container my-5">
  <h1 class="text-center mb-4">Explore FilmSpace</h1>
  <div class="row justify-content-center">

    <!-- Movies Card -->
    <div class="col-md-5 mb-4">
      <div class="card shadow-lg position-relative border-0">
        <a href="{% url 'movies' %}">
          <img src="{% static 'admin_home.jpg' %}" class="card-img" alt="Movies" style="height:400px; object-fit:cover; border-radius:10px;">
          <div class="card-img-overlay d-flex flex-column justify-content-center align-items-center text-center">
            <h3 class="text-white fw-bold" style="text-shadow:0 0 10px rgba(0,0,0,0.8);">Movies</h3>
            <p class="text-white mb-0" style="text-shadow:0 0 10px rgba(0,0,0,0.8);">Discover trending and classic movies.</p>
          </div>
        </a>
      </div>
    </div>

    <!-- Series Card -->
    <div class="col-md-5 mb-4">
      <div class="card shadow-lg position-relative border-0">
        <a href="{% url 'series' %}">
          <img src="{% static 'admin_series.jpg' %}" class="card-img" alt="Series" style="height:400px; object-fit:cover; border-radius:10px;">
          <div class="card-img-overlay d-flex flex-column justify-content-center align-items-center text-center">
            <h3 class="text-white fw-bold" style="text-shadow:0 0 10px rgba(0,0,0,0.8);">Series</h3>
            <p class="text-white mb-0" style="text-shadow:0 0 10px rgba(0,0,0,0.8);">Discover trending and classic series.</p>
          </div>
        </a>
      </div>
    </div>

  </div>
</div>

{% endblock %}
