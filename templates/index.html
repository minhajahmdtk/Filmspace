{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-warning-subtle">

  <!-- Hero Section -->
  <div class="container-fluid d-flex align-items-center justify-content-center" style="margin-top: 40px;">
    <div class="row g-0 shadow-lg overflow-hidden bg-white" 
         style="height: 700px; width: 1450px; border-radius: 20px;">
      
      <!-- Left Content -->
      <div class="col-md-6 position-relative d-flex flex-column justify-content-center p-5" 
           style="border-top-left-radius: 40px; border-bottom-left-radius: 40px;">
        
        <!-- FilmSpace Logo (Top Left Inside White Section) -->
        <img src="{% static 'images/filmspace_logo.png' %}" 
             alt="FilmSpace Logo" 
             class="position-absolute"
             style="top: 20px; left: 20px; width: 120px; height: auto; ">

        <!-- Text and Button -->
        <div >
          <h1 class="fw-bold mb-3 display-5">FILM MAKERS<br>SHOWCASE</h1>
          <p class="text-muted  fs-6" style="margin-bottom: 50px;">
            Join us for an immersive journey into the world of cinema.<br>
            Discover, create, and share your stories through the lens of imagination.
          </p>
          <a href="{% url 'register' %}" class="btn btn-dark text-white fw-semibold px-5 py-3 rounded-pill" style="margin-top: 50px;">
             Register Now
          </a>
        </div>

      </div>

      <!-- Right Image -->
      <div class="col-md-6 bg-light d-flex align-items-center justify-content-center" 
           style="border-top-right-radius: 10px; border-bottom-right-radius: 10px; overflow: hidden;">
        <img src="{% static 'movies.jpg' %}" 
             alt="Creative Team" 
             class="img-fluid" 
             style="object-fit: cover; width: 100%; height: 650px; border-radius: 20px;">
      </div>

    </div>
  </div>

</body>
</html>
