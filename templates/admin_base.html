<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace Admin</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="{% static 'website.css' %}">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light px-4" 
       style="background-color:#DEB887; height: 80px; padding-top: 10px; padding-bottom: 10px;">
    <div class="container-fluid">

      <!-- Left: Logo + Brand -->
      <a class="navbar-brand d-flex align-items-center fw-bold text-danger" href="{% url 'admin_home' %}">
        <img src="{% static 'images/filmspace_logo.png' %}" 
             alt="FilmSpace Logo" width="45" height="45" 
             class="me-2 rounded">
      </a>

      <!-- Center: Home -->
      <div class="position-absolute start-50 translate-middle-x">
        <a class="nav-link fw-semibold text-dark fs-5" href="{% url 'admin_home' %}">Home</a>
      </div>

      <!-- Right: Sign Out -->
      <div class="ms-auto">
        <a href="{% url 'admin_login' %}" class="btn btn-outline-dark fw-semibold px-4 py-2">Sign Out</a>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container mt-5">
    {% block content %}
    {% endblock %}
  </div>

</body>
</html>
