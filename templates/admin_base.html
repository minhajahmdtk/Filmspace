<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'website.css' %}">
</head>

<body style="background-color:#fff; min-height:100vh; overflow-x:hidden;">
  <div class="container-fluid position-fixed top-0 start-0 py-3 px-4 d-flex flex-wrap justify-content-between align-items-center"
       style="z-index:1000; background:rgba(255,255,255,0.6); backdrop-filter:blur(5px);">

   
    <div class="d-flex align-items-center mb-2 mb-md-0">
      <img src="{% static 'fs3.png' %}" 
           alt="FilmSpace Logo"  width="35px" height="35px" style="margin-left:20px">
      
    </div>

    
    <div class="text-center mb-2 mb-md-0 position-absolute start-50 translate-middle-x">
      <a class="fw-semibold text-decoration-none px-3 py-2 rounded"
         href="{% url 'admin_home' %}"
         style="color:#000;">
        Home
      </a>
    </div>

  
    <div class="d-none d-md-flex gap-2 justify-content-end">
      <a href="{% url 'admin_login' %}" 
         class="btn btn-outline-dark fw-semibold px-4 py-2">
        Sign Out
      </a>
    </div>

    <div class="dropdown d-md-none">
      <button class="btn btn-outline-dark dropdown-toggle fw-semibold" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Menu
      </button>
      <ul class="dropdown-menu dropdown-menu-end text-center">
        <li><a class="dropdown-item fw-semibold" href="{% url 'admin_manage_movies' %}">Manage Movies</a></li>
        <li><a class="dropdown-item fw-semibold" href="{% url 'admin_manage_series' %}">Manage Series</a></li>
        <li><a class="dropdown-item fw-semibold" href="{% url 'admin_login' %}">Sign Out</a></li>
      </ul>
    </div>
  </div>


  <div class="container" style="padding-top:120px;">
    {% block content %}
    {% endblock %}
  </div>

</body>
</html>
