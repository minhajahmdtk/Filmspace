{% extends 'admin_base.html' %}
{% load static %}
{% block title %}Add Movie | FilmSpace{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<div class="d-flex justify-content-center align-items-center  ">
  <div class="shadow p-4 rounded bg-white w-100" style="max-width: 700px;">
    <h3 class="text-center mb-4 fw-bold text-dark bg-dark text-white py-2 rounded"><i class="bi bi-arrow-return-right"></i> Add Movie</h3>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label for="movie_name" class="form-label fw-semibold">Movie Name</label>
          <input type="text" id="movie_name" name="movie_name" class="form-control" placeholder="Enter movie name" required>
        </div>

        <div class="col-md-6">
          <label for="movie_year" class="form-label fw-semibold">Year</label>
          <input type="number" id="movie_year" name="movie_year" class="form-control" placeholder="Enter release year" required>
        </div>

        <div class="col-md-6">
          <label for="movie_language" class="form-label fw-semibold">Language</label>
          <input type="text" id="movie_language" name="movie_language" class="form-control" placeholder="Enter language">
        </div>

        <div class="col-md-6">
          <label for="movie_genre" class="form-label fw-semibold">Genre</label>
          <input type="text" id="movie_genre" name="movie_genre" class="form-control" placeholder="Enter genre">
        </div>

        <div class="col-md-6">
          <label for="movie_director" class="form-label fw-semibold">Director</label>
          <input type="text" id="movie_director" name="movie_director" class="form-control" placeholder="Enter director name" required>
        </div>

        <div class="col-md-6">
          <label for="movie_image" class="form-label fw-semibold">Upload Image</label>
          <input type="file" id="movie_image" name="movie_image" class="form-control" required>
        </div>

        <div class="col-12">
          <label for="movie_description" class="form-label fw-semibold">Description</label>
          <textarea id="movie_description" name="movie_description" rows="3" class="form-control" placeholder="Enter movie description"></textarea>
        </div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-dark fw-semibold">Add Movie</button>
      </div>
    </form>

    {% if messages %}
      <div class="mt-3">
        {% for msg in messages %}
          <div class="alert alert-info text-center py-2">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
