<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmSpace | Sign In</title>

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body style="background-color: #FFFAF0">

  <div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="row shadow-lg rounded-4 overflow-hidden" style="max-width: 950px; width: 100%; background-color: white;">

      <!-- Left Image Section -->
      <div class="col-md-6 p-0">
        <img src="{% static 'Sign.jpg' %}" 
             alt="Login Illustration" 
             class="img-fluid h-100 w-100" 
             style="object-fit: cover;">
      </div>

      <!-- Right Login Section -->
      <div class="col-md-6 bg-white p-5 d-flex flex-column justify-content-center">
        <h3 class="text-center mb-4 fw-bold text-secondary ">
          <i class="bi bi-arrow-right-circle me-2 text-secondary "></i> Sign In
        </h3>

        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-secondary fw-semibold">Sign In</button>
          </div>

          {% for i in messages %}
            <div class="alert alert-danger mt-3 text-center py-2">{{ i }}</div>
          {% endfor %}
        </form>

        
      </div>

    </div>
  </div>

</body>
</html>
